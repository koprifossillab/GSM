# GSM(대돌여지도)을 80 포트의 /GSM/ 아래에 얹는다.
#
# 까닭은 ForGIA·DiaRUGA 와 같다 — 사내 VPN 이 80 만 통과시키고, 이 머신의 80 은
# phyloserver 블록이 `server_name 172.16.116.98` 로 이미 잡고 있다. 그래서
# 호스트명 vhost 로 가르지 못하고 서브경로로 얹는다. 셋이 나란히 산다.
#
# 설치:
#   sudo cp deploy/nginx/GSM-subpath.conf /etc/nginx/snippets/GSM-subpath.conf
#   # /etc/nginx/sites-enabled/phyloserver 의 server 블록 안에 한 줄:
#   #     include snippets/GSM-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx

# 뿌리로 들어오면 슬래시를 붙여 보낸다. 이게 없으면 Django 가 /GSM 을 못 찾는다.
location = /GSM {
    return 301 /GSM/;
}

location /GSM/ {
    proxy_pass http://127.0.0.1:9310;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 상류 타일이 늦을 때가 있다. 기본 60 초로는 모자라지 않지만, 첫 요청이
    # 상류의 캐시를 데우는 동안 길어지는 일이 있어 넉넉히 준다.
    proxy_read_timeout 90s;

    # 점묶음 업로드. settings.DATA_UPLOAD_MAX_MEMORY_SIZE 와 맞춘다.
    client_max_body_size 16m;
}

# 타일과 정적 파일은 오래 들고 있어도 된다. 상류 부하를 줄이는 자리이기도 하다.
# **주의:** 인증키가 없을 때 뜨는 안내 타일은 뷰가 `no-store` 를 붙여 보내므로
# 여기 걸리지 않는다. 키가 생기면 곧바로 진짜 타일이 뜬다.
location /GSM/static/ {
    proxy_pass http://127.0.0.1:9310;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public, immutable";
}
