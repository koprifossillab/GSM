# /srv/GSM/docker-compose.yml 에 두는 것. **운영이 이 파일로 돈다.**
#
#   cd /srv/GSM && docker compose up -d web
#   cd /srv/GSM && docker compose pull && docker compose up -d web
#
# 굽는 쪽(저장소의 deploy/docker-compose.yml)과 갈라 둔 까닭은 ForGIA 와 같다 —
# 운영 장비에 저장소를 두지 않기 위해서다. 여기에는 이미지 이름과 마운트만 있다.

name: gsm

services:
  web:
    image: koprifossillab/gsm:${GSM_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      TZ: Asia/Seoul
      GSM_DB_PATH: /srv/GSM/db/GSM.db
      GSM_TILE_CACHE_DIR: /srv/GSM/tiles
      # 남극 지질도(SCAR GeoMAP) 파일. 없으면 남극 레이어에 안내 타일이 뜰 뿐이다 (devlog 018)
      GSM_GEOMAP_DIR: /srv/GSM/geomap
      # NPI 에서 받아 둔 파일(얀마옌 지질도). 없으면 그 레이어에 "자료가 없다" 가 뜰 뿐이다 (devlog 022)
      GSM_NPOLAR_DIR: /srv/GSM/npolar
      GSM_DEBUG: "0"
      GSM_URL_PREFIX: "GSM/"
    volumes:
      - /srv/GSM/db:/srv/GSM/db
      - /srv/GSM/tiles:/srv/GSM/tiles
      # 읽기만 한다. ATA_SCAR_GeoMAP_Geology_v2022_08.gpkg 를 여기 둔다
      - /srv/GSM/geomap:/srv/GSM/geomap:ro
      # 읽기만 한다. NP_J250_Geologi/NP_J250_Geologi_{f,l,p}.geojson 를 여기 둔다
      - /srv/GSM/npolar:/srv/GSM/npolar:ro
    ports:
      - "127.0.0.1:8094:9090"
